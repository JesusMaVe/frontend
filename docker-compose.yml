# Imagen web: estáticos del build + proxy /auth → auth-svc y /api → api por la red compartida.
services:
  web:
    build:
      context: .
      args:
        VITE_LOG_JWT: ${WEB_LOG_JWT:?WEB_LOG_JWT no definida}
        VITE_ITEM_TITLE_MAX: ${VITE_ITEM_TITLE_MAX:?VITE_ITEM_TITLE_MAX no definida}
        VITE_ITEM_DESCRIPTION_MAX: ${VITE_ITEM_DESCRIPTION_MAX:?VITE_ITEM_DESCRIPTION_MAX no definida}
    environment:
      NGINX_PORT: ${NGINX_PORT:?NGINX_PORT no definida}
      AUTH_SVC_UPSTREAM: ${AUTH_SVC_UPSTREAM:?AUTH_SVC_UPSTREAM no definida}
      API_UPSTREAM: ${API_UPSTREAM:?API_UPSTREAM no definida}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:?WEB_HOST_PORT no definida}:${NGINX_PORT:?NGINX_PORT no definida}"
    networks:
      shared:
        # IP fija: auth-svc solo confía en el X-Forwarded-For que viene de aquí (TRUSTED_PROXIES).
        ipv4_address: ${WEB_PROXY_IP:?WEB_PROXY_IP no definida}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  shared:
    name: ${SHARED_NETWORK:?SHARED_NETWORK no definida}
    external: true
