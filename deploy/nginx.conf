# Config principal para nginx sin privilegios con filesystem de solo lectura: todo lo que se
# escribe va a /tmp (tmpfs). El entrypoint genera los server blocks en /tmp (debe existir y ser
# escribible: por eso /tmp y no un subdirectorio).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  # Formato por defecto: no incluye cabeceras (el Authorization nunca llega al log).
  access_log /dev/stdout;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  include /tmp/*.conf;
}
